<!DOCTYPE html>
<html>
    <head>
        <title>GeoDataDashboard</title>
        <link href = "stylesheet.css" rel = "stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.datatables.net/2.2.1/css/dataTables.dataTables.min.css">
    </head>
    <body>
        <header>
            <h1>Data-Dashboard</h1>
        </header>

        <nav>
                <button class = "model-tab active" data-model = "city"> City</button>  <!--attribute data with access trough dataset-->
                <button class = "model-tab" data-model = "country">Country</button>
                <button class = "model-tab" data-model = "river">River</button>
        </nav>
        
        <!--scripts-->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.datatables.net/2.2.1/js/dataTables.min.js"></script>
        <script src = "app.js"></script>
        
        <!--form-->
        <dialog id = "recordModal">
            <form id = "recordForm">
                <div id = "formFields"></div>
                <div class = "modal-actions">
                    <button type = "submit">Save</button>
                    <button type = "button" id = closeModal>Cancel</button>
                </div>
            </form>
        </dialog>

        <!--delete warining-->
        <dialog id="deleteModal">

            <h2>Delete Record</h2>

            <p id="deleteMessage"></p>

            <button id="confirmDelete">
                Delete
            </button>

            <button id="cancelDelete">
                Cancel
            </button>

        </dialog>
                
        <!--content card-->
        <content-card>
            <table id="table"></table>
        </content-card>
    </body>
</html>
