aclRules:
  - roles: admin #in diesem fall
    allows:
      - resources:
          - City
          - Country
          - River
        permissions: "*"

  - roles: reader
    allows:
      - resources:
          - City
          - Country
          - River
        permissions:
          - read

  - roles: cityEditor
    allows:
      - resources:
        - City
      - permissions:
        - read
        - create
        - update
        - delete
        - search